            - heading "Security Findings" [level=3] [ref=f14e100]
            - generic [ref=f14e101]: "15"
          - generic [ref=f14e103]:
            - generic [ref=f14e104]:
              - generic [ref=f14e105]: Medium
              - generic [ref=f14e106]:
                - paragraph [ref=f14e107]: Missing Content Security Policy (CSP) on mokka.ru, partner-app.mokka.ru, demo.mokka.ru
                - paragraph [ref=f14e108]: mokka.ru, partner-app.mokka.ru, demo.mokka.ru
                - paragraph [ref=f14e109]: The application responses do not include a Content-Security-Policy header. Without CSP, the impact of any XSS or script injection increases (reduced ability to restrict script execution sources).
            - generic [ref=f14e110]:
              - generic [ref=f14e111]: Medium
              - generic [ref=f14e112]:
                - paragraph [ref=f14e113]: Missing clickjacking protection headers (X-Frame-Options) on mokka.ru and partner-app.mokka.ru
                - paragraph [ref=f14e114]: mokka.ru, partner-app.mokka.ru
                - paragraph [ref=f14e115]: The application does not set X-Frame-Options. This enables clickjacking attacks where an attacker can embed the site in a malicious iframe and trick users into interacting with attacker-controlled UI.
            - generic [ref=f14e116]:
              - generic [ref=f14e117]: Medium
              - generic [ref=f14e118]:
                - paragraph [ref=f14e119]: Insecure session cookie configuration (qrator_ssid missing HttpOnly/Secure/SameSite)
                - paragraph [ref=f14e120]: "mokka.ru (cookie: qrator_ssid)"
                - paragraph [ref=f14e121]: The qrator_ssid cookie is missing HttpOnly, Secure, and SameSite flags. This increases risk of session theft via XSS (no HttpOnly), interception via MITM (no Secure), and CSRF/session riding (no SameSite).
            - generic [ref=f14e122]:
              - generic [ref=f14e123]: Medium
              - generic [ref=f14e124]:
                - paragraph [ref=f14e125]: "Weak TLS configuration: 3DES cipher suite enabled (TLS_RSA_WITH_3DES_EDE_CBC_SHA)"
                - paragraph [ref=f14e126]: mokka.ru (TLS)
                - paragraph [ref=f14e127]: A weak 3DES cipher suite is enabled. This can allow downgrade/legacy cipher usage and is associated with SWEET32-style attacks against 3DES in CBC mode.
              - generic [ref=f14e128]: CVE-2016-2183
            - generic [ref=f14e129]:
              - generic [ref=f14e130]: Medium
              - generic [ref=f14e131]:
                - paragraph [ref=f14e132]: "CORS misconfiguration: Access-Control-Allow-Origin '*' with credentials enabled"
                - paragraph [ref=f14e133]: mokka.ru/cc/, landings-b.mokka.ru
                - paragraph [ref=f14e134]: "CORS is configured with Access-Control-Allow-Origin: * while allowing credentials. This can enable cross-origin data access or CSRF-like abuse depending on browser behavior and additional headers."
            - generic [ref=f14e135]:
              - generic [ref=f14e136]: Medium
              - generic [ref=f14e137]:
                - paragraph [ref=f14e138]: Information disclosure via Next.js build data endpoint (public merchant database in /_next/data)
                - paragraph [ref=f14e139]: mokka.ru/_next/data/r2SZpa_GtWJuvtahjK0Jd/index.json
                - paragraph [ref=f14e140]: The Next.js data endpoint returns a 320KB JSON file without authentication, disclosing a merchant/partner database and related business data (IDs, payment terms, asset URLs, tracking parameters). This enables competitor intelligence and potential downstream abuse.
            - generic [ref=f14e141]:
              - generic [ref=f14e142]: Low
              - generic [ref=f14e143]:
                - paragraph [ref=f14e144]: Backend infrastructure URL disclosure in client-side config (env-config.js)
                - paragraph [ref=f14e145]: mokka.ru/cc/env-config.js
                - paragraph [ref=f14e146]: Client-side JavaScript exposes backend URLs (e.g., kokao.revoup.ru and other endpoints). This materially aids attacker reconnaissance and increases the chance of successful targeting of internal/sandbox services.
            - generic [ref=f14e147]:
              - generic [ref=f14e148]: High
              - generic [ref=f14e149]:
                - paragraph [ref=f14e150]: "Demo Rails admin endpoint misconfigured: HTTP 500 on /admin"
                - paragraph [ref=f14e151]: demo.mokka.ru/admin
                - paragraph [ref=f14e152]: The /admin endpoint returns HTTP 500 Internal Server Error instead of a proper 403/404. This indicates a misconfiguration and may leak framework/error details or enable further probing for authentication bypass or backend issues.
            - generic [ref=f14e153]:
              - generic [ref=f14e154]: High
              - generic [ref=f14e155]:
                - paragraph [ref=f14e156]: Authentication rate limiting missing on partner-app.mokka.ru/auth/sign-in (credential stuffing risk)
                - paragraph [ref=f14e157]: partner-app.mokka.ru/auth/sign-in
                - paragraph [ref=f14e158]: The authentication endpoint allows high-rate attempts without rate limiting, IP blocking, progressive delays, or CAPTCHA. This enables credential stuffing and brute-force attacks against partner accounts.
            - generic [ref=f14e159]:
              - generic [ref=f14e160]: High
              - generic [ref=f14e161]:
                - paragraph [ref=f14e162]: Authentication rate limiting missing on partner-app.mokka.ru/api/auth/login (credential stuffing risk)
                - paragraph [ref=f14e163]: partner-app.mokka.ru/api/auth/login
                - paragraph [ref=f14e164]: An alternative authentication vector (/api/auth/login) is unprotected by rate limiting controls, enabling high-volume login attempts and credential stuffing.
            - generic [ref=f14e165]:
              - generic [ref=f14e166]: High
              - generic [ref=f14e167]:
                - paragraph [ref=f14e168]: Authentication rate limiting missing on demo.mokka.ru/users/sign_in (credential stuffing risk)
                - paragraph [ref=f14e169]: demo.mokka.ru/users/sign_in
                - paragraph [ref=f14e170]: The demo sign-in endpoint lacks rate limiting controls, allowing repeated authentication attempts without throttling. Even if labeled 'demo', this can be abused for credential testing and may expose real accounts or shared logic.
            - generic [ref=f14e171]:
              - generic [ref=f14e172]: Medium
              - generic [ref=f14e173]:
                - paragraph [ref=f14e174]: "HTTP verb misconfiguration on authentication endpoint: POST /auth/sign-in returns 405"
                - paragraph [ref=f14e175]: partner-app.mokka.ru/auth/sign-in
                - paragraph [ref=f14e176]: The login endpoint does not accept POST (returns HTTP 405 Method Not Allowed), which breaks expected authentication workflows and complicates secure handling. Misconfigurations like this can also indicate inconsistent auth routing that may be exploitable in other contexts.
            - generic [ref=f14e177]:
              - generic [ref=f14e178]: Medium
              - generic [ref=f14e179]:
                - paragraph [ref=f14e180]: Username enumeration via timing differences on partner-app.mokka.ru/auth/sign-in
                - paragraph [ref=f14e181]: partner-app.mokka.ru/auth/sign-in
                - paragraph [ref=f14e182]: The response timing differs between existing and non-existing usernames (approx. 0.300s). This can enable user enumeration, which increases the effectiveness of targeted credential stuffing and phishing.
            - generic [ref=f14e183]:
              - generic [ref=f14e184]: Low
              - generic [ref=f14e185]:
                - paragraph [ref=f14e186]: Missing security headers (X-Content-Type-Options, Referrer-Policy, Permissions-Policy, etc.) on mokka.ru and partner-app.mokka.ru
                - paragraph [ref=f14e187]: mokka.ru, partner-app.mokka.ru
                - paragraph [ref=f14e188]: Multiple recommended security headers are absent (e.g., X-Content-Type-Options, Referrer-Policy, Permissions-Policy, and others). This reduces defense-in-depth and can increase exposure to browser-based attacks.
            - generic [ref=f14e189]:
              - generic [ref=f14e190]: Low
              - generic [ref=f14e191]:
                - paragraph [ref=f14e192]: Information disclosure via Rails framework fingerprinting headers (X-Runtime, X-Request-Id)
                - paragraph [ref=f14e193]: demo.mokka.ru/admin
                - paragraph [ref=f14e194]: Error responses expose framework and request identifiers (e.g., X-Runtime and X-Request-Id). This aids fingerprinting and can support timing/behavior analysis for further attacks.
